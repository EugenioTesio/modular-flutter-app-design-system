# Static analysis for the design_system_lints analyzer plugin. It is a plain
# Dart package, analyzed on its own (the root analysis_options.yaml excludes
# lints/**).
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - directives_ordering
    - prefer_const_constructors
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
