# Static analysis for the design system. `flutter analyze` must report 0 issues.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # The Widgetbook app and the lint plugin are separate projects, analyzed
    # on their own.
    - widgetbook/**
    - lints/**
    - build/**

linter:
  rules:
    - public_member_api_docs
    - comment_references
    - always_declare_return_types
    - prefer_final_fields
    - avoid_dynamic_calls

# The design system's own token lint (design_system_lints in lints/). Every
# component must report 0 diagnostics.
plugins:
  design_system_lints:
    path: lints
