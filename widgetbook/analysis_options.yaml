# Static analysis for the Widgetbook. The design_system_lints plugin is not
# enabled here, because use cases may use literal test data.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - web/**
    - macos/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
